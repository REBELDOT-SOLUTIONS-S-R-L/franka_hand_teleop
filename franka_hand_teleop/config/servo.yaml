moveit_servo:
  move_group_name: fr3_arm
  publish_period: 0.01
  max_expected_latency: 0.05
  incoming_command_timeout: 0.15
  command_in_type: speed_units
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_accelerations: false
  use_smoothing: true
  smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
  is_primary_planning_scene_monitor: true
  check_octomap_collisions: false
  joint_topic: /hand_teleop_fake/joint_states
  monitored_planning_scene_topic: /hand_teleop_fake/planning_scene
  cartesian_command_in_topic: /hand_teleop_fake/servo_node/delta_twist_cmds
  status_topic: /hand_teleop_fake/servo_node/status
  command_out_topic: /hand_teleop_fake/servo_trajectory
  joint_limit_margins: [0.10]
  check_collisions: true
  collision_check_rate: 30.0
  self_collision_proximity_threshold: 0.015
  scene_collision_proximity_threshold: 0.025
