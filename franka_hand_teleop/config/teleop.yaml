/**/hand_bridge:
  ros__parameters:
    # Tool travel in fr3_link0, metres: 50 mm inward from EVERY face of the
    # measured box [0.40,-0.35,0.00] to [0.70,0.35,0.30]. Simulation only.
    # Z=0 is the mounting plane; X/Y origin is the centre of joint 1's axis.
    workspace_min: [0.45, -0.30, 0.05]
    workspace_max: [0.65, 0.30, 0.25]
    # Separate example whole-arm volume: base, elbow, wrist, hand and fingers.
    arm_workspace_min: [-0.45, -0.55, -0.05]
    arm_workspace_max: [0.85, 0.55, 1.10]
    workspace_margin: 0.02
    max_speed: 0.08
    max_acceleration: 0.30
    udp_port: 49300
