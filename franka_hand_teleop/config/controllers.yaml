/**/controller_manager:
  ros__parameters:
    update_rate: 100
    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    fake_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
/**/fr3_arm_controller:
  ros__parameters:
    # The workspace guard forwards position-only paths (linear joint interpolation).
    cmd_timeout: 0.25
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
/**/fake_gripper_controller:
  ros__parameters:
    cmd_timeout: 0.25
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints: [fr3_finger_joint1]
